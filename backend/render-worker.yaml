# Combined Celery Worker + Beat Scheduler Configuration
# Single service that runs both worker and beat scheduler (cost-effective)
# Use this when you already have backend and PostgreSQL deployed

services:
  # Combined Celery Service (Worker + Beat Scheduler)
  - type: worker
    name: movie-mate-background-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: |
      echo "Building background worker..."
      pip install -r requirements/prod.txt
      echo "Background worker dependencies installed"
    startCommand: |
      chmod +x start_combined_celery.sh
      ./start_combined_celery.sh
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false  # Set manually from existing backend
      - key: DEBUG
        value: false
      - key: POSTGRES_DB
        sync: false  # Set manually from existing PostgreSQL
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: 5432
      - key: REDIS_URL
        sync: false  # Set manually from Redis service
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: IMDB_API_KEY
        sync: false
      - key: ELASTICSEARCH_CLOUD_URL
        sync: false
      - key: ELASTICSEARCH_USERNAME
        sync: false
      - key: ELASTICSEARCH_PASSWORD
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # 🎯 REMOVED: Separate Celery Beat service (now combined above)
  # This saves cost by running Worker + Beat in single container

  # Redis Service (if you don't have one)
  - type: redis
    name: movie-mate-redis
    plan: starter
    ipAllowList: []
