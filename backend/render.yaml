services:
  - type: web
    name: movie-mate-backend
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements/prod.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: POSTGRES_DB
        fromDatabase:
          name: movie-mate-db
          property: databaseName
      - key: POSTGRES_USER
        fromDatabase:
          name: movie-mate-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: movie-mate-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: movie-mate-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: movie-mate-db
          property: port
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: FRONTEND_URL
        value: "https://movie-mate-v2.vercel.app"
      - key: REDIS_URL
        fromService:
          type: redis
          name: movie-mate-redis
          property: connectionString
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: ELASTICSEARCH_DSL_AUTOSYNC
        value: "true"
      - key: ELASTICSEARCH_DSL_AUTO_REFRESH
        value: "true"

  - type: redis
    name: movie-mate-redis
    ipAllowList: []

  - type: elasticsearch
    name: movie-mate-elasticsearch
    ipAllowList: []

databases:
  - name: movie-mate-db
    databaseName: movie_mate
    user: movie_mate_user
    plan: free

